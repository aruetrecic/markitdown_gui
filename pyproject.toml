[project]
name = "markitdown-gui"
version = "0.1.0"
description = "GUI web para convertir múltiples formatos a Markdown usando MarkItDown"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Antonio Rueda", email = "antonio.rueda@gmail.com" }
]
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "markitdown[all]==0.1.5",
    "pymupdf4llm>=0.0.17",
    "pytesseract>=0.3.10",
    "python-multipart==0.0.32",
    "python-dotenv>=1.0.1",
    "slowapi>=0.1.9",
    "presidio-analyzer>=2.2,<3",
    "presidio-anonymizer>=2.2,<3",
    "spacy>=3.8,<3.9",
    "es-core-news-lg @ https://github.com/explosion/spacy-models/releases/download/es_core_news_lg-3.8.0/es_core_news_lg-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.2",
    "httpx>=0.28,<0.29",
    "black==23.12.1",
    "ruff==0.1.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Solo se silencia ruido de librerías/infra de test, NO warnings de este código:
#  - GZipMiddleware + TestClient deja un objeto gzip que, al recolectarse,
#    lanza "I/O operation on closed file"; pytest lo reporta como unraisable.
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes (por defecto). I: orden de imports.
# UP: modernización de sintaxis (typing nativo). B: bugbear (errores sutiles).
select = ["E", "F", "I", "UP", "B"]
# B008: usar File()/Form()/Depends() como valores por defecto es el patrón
# idiomático de FastAPI (inyección de dependencias), no un bug.
ignore = ["B008"]
